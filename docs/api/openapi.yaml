openapi: 3.1.0
info:
  title: Paymug Public API
  version: 0.1.0
  description: API-key resource endpoints for products, orders, customers, and subscriptions.
servers:
  - url: https://{host}
    variables:
      host:
        default: example.invalid
paths:
  /api/v1/products:
    get:
      operationId: listProducts
      summary: List products
      security:
        - bearerApiKey: []
        - apiKeyHeader: []
      responses:
        '200':
          description: Products owned by the API-key owner.
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/orders:
    get:
      operationId: listOrders
      summary: List orders
      security:
        - bearerApiKey: []
        - apiKeyHeader: []
      responses:
        '200':
          description: Orders owned by the API-key owner.
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/customers:
    get:
      operationId: listCustomers
      summary: List customers
      security:
        - bearerApiKey: []
        - apiKeyHeader: []
      responses:
        '200':
          description: Customers owned by the API-key owner.
          content:
            application/json:
              schema:
                type: object
                required: [customers]
                properties:
                  customers:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/subscriptions:
    get:
      operationId: listSubscriptions
      summary: List subscriptions
      description: Requires the `subscriptions:read` permission. Returns the key owner's subscriptions in their active environment.
      security:
        - bearerApiKey: []
        - apiKeyHeader: []
      responses:
        '200':
          description: Subscriptions owned by the API-key owner.
          content:
            application/json:
              schema:
                type: object
                required: [subscriptions]
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The key lacks `subscriptions:read`.
  /api/v1/subscriptions/{id}/cancel:
    post:
      operationId: cancelSubscription
      summary: Cancel a subscription
      description: |
        Requires the `subscriptions:write` permission. Cancels the subscription at
        its payment provider (PayPal or Stripe) immediately and sets its status to
        `cancelled`. This cannot be undone. Repeating the call on a cancelled
        subscription returns it unchanged with `200`.
      security:
        - bearerApiKey: []
        - apiKeyHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Subscription record ID, from `GET /api/v1/subscriptions`.
      responses:
        '200':
          description: The cancelled subscription.
          content:
            application/json:
              schema:
                type: object
                required: [subscription]
                properties:
                  subscription:
                    $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The key lacks `subscriptions:write`.
        '404':
          description: No such subscription in the key owner's active environment.
        '409':
          description: The subscription is in a state that cannot be cancelled (for example a pending migration).
        '502':
          description: The payment provider rejected the cancellation. The subscription is unchanged; retry later.
components:
  schemas:
    Subscription:
      type: object
      additionalProperties: true
      required: [id, title, status]
      properties:
        id:
          type: string
        title:
          type: string
          description: Plan or product name.
        subtitle:
          type: string
          description: Customer email.
        status:
          type: string
          description: For example `active`, `trialing`, `suspended`, `cancelled`.
        data:
          type: object
          additionalProperties: true
          description: Includes `cancelledAt` and `cancelledBy` (`customer`, `api` or `mcp`) after a cancellation made through Paymug.
    ExtraSeatTier:
      type: object
      required: [from, price]
      properties:
        from:
          type: integer
          minimum: 1
          maximum: 1000
          description: First extra seat (1-based) this price applies to. The first tier always starts at 1.
        price:
          type: integer
          minimum: 0
          description: Price per extra seat in cents.
    Product:
      type: object
      additionalProperties: true
      properties:
        licenseSeatLimit:
          type: [integer, 'null']
          description: Base device seats for a licensed product; null means unlimited.
        extraSeatsEnabled:
          type: boolean
          description: Buyers can add seats beyond licenseSeatLimit at checkout. Requires a finite seat limit.
        extraSeatLabel:
          type: string
          maxLength: 40
          description: Buyer-facing name for extra seats. Empty uses the default.
        extraSeatTiers:
          type: array
          description: Accumulating per-seat prices. Each extra seat is charged at the tier it falls in. Buyers choose a count with the checkout custom field extra_seats. To add seats to an existing license, also send the custom field seat_addon_order with the original order ID; only the new seats are charged and the license seat limit grows once the order is paid.
          items:
            $ref: '#/components/schemas/ExtraSeatTier'
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      description: Send the key as Authorization: Bearer <key>.
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: Send the key in the x-api-key header.
  responses:
    Unauthorized:
      description: Missing, invalid, or expired API key.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
