openapi: 3.1.0
info:
  title: Paymug Public API
  version: 0.1.0
  description: API-key resource endpoints for products, orders, and customers.
servers:
  - url: https://{host}
    variables:
      host:
        default: example.invalid
paths:
  /api/v1/products:
    get:
      operationId: listProducts
      summary: List products
      security:
        - bearerApiKey: []
        - apiKeyHeader: []
      responses:
        '200':
          description: Products owned by the API-key owner.
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/orders:
    get:
      operationId: listOrders
      summary: List orders
      security:
        - bearerApiKey: []
        - apiKeyHeader: []
      responses:
        '200':
          description: Orders owned by the API-key owner.
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/customers:
    get:
      operationId: listCustomers
      summary: List customers
      security:
        - bearerApiKey: []
        - apiKeyHeader: []
      responses:
        '200':
          description: Customers owned by the API-key owner.
          content:
            application/json:
              schema:
                type: object
                required: [customers]
                properties:
                  customers:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    ExtraSeatTier:
      type: object
      required: [from, price]
      properties:
        from:
          type: integer
          minimum: 1
          maximum: 1000
          description: First extra seat (1-based) this price applies to. The first tier always starts at 1.
        price:
          type: integer
          minimum: 0
          description: Price per extra seat in cents.
    Product:
      type: object
      additionalProperties: true
      properties:
        licenseSeatLimit:
          type: [integer, 'null']
          description: Base device seats for a licensed product; null means unlimited.
        extraSeatsEnabled:
          type: boolean
          description: Buyers can add seats beyond licenseSeatLimit at checkout. Requires a finite seat limit.
        extraSeatTiers:
          type: array
          description: Accumulating per-seat prices. Each extra seat is charged at the tier it falls in. Buyers choose a count with the checkout custom field extra_seats.
          items:
            $ref: '#/components/schemas/ExtraSeatTier'
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      description: Send the key as Authorization: Bearer <key>.
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: Send the key in the x-api-key header.
  responses:
    Unauthorized:
      description: Missing, invalid, or expired API key.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
